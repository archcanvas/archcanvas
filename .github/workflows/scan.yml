name: scan

# This repository holds documentation, examples and images — no application code
# and no credentials. This job is the tripwire that keeps it that way: it fails
# if anything that looks like a secret, a host, or a key ever lands here.
#
# It complements GitHub's own secret scanning and push protection rather than
# replacing them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked text files for secret-shaped content
        run: |
          cat > /tmp/scan.mjs <<'SCAN'
          import { readFileSync } from "node:fs";

          const RULES = [
            ["IPv4 address",      /\b(?:\d{1,3}\.){3}\d{1,3}\b/],
            ["ssh to root",       /\broot@[\w.-]+/],
            ["private key block", /BEGIN (?:RSA |EC |OPENSSH |PGP )?PRIVATE KEY/],
            ["API key",           /\bsk-[A-Za-z0-9_-]{16,}/],
            ["Stripe live key",   /\b(?:sk|rk|pk)_live_[A-Za-z0-9]{8,}/],
            ["Stripe webhook",    /\bwhsec_[A-Za-z0-9]{8,}/],
            ["AWS key id",        /\bAKIA[0-9A-Z]{16}\b/],
            ["Google API key",    /\bAIza[0-9A-Za-z_-]{30,}\b/],
            ["GitHub token",      /\bgh[pousr]_[A-Za-z0-9]{20,}\b/],
            ["database URL",      /\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis):\/\/[^\s"'<>]+/i],
            ["connection secret", /\b(?:DATABASE_URL|OPENAI_API_KEY|CRON_SECRET|API_SECRET|SSH_KEY|PASSPHRASE)\b/],
            ["basic auth in URL", /https?:\/\/[^\s/@"']+:[^\s/@"']+@/],
          ];

          // Line fragments that are known-good and must not trip a rule.
          const ALLOW = [
            "chanmeng.dev@gmail.com",
          ];

          const files = process.argv.slice(2);
          let hits = 0;

          for (const file of files) {
            // This file is the rule list; it necessarily contains the shapes it
            // is looking for. GitHub's own secret scanning still covers it.
            if (file.endsWith(".github/workflows/scan.yml")) continue;

            let text;
            try {
              text = readFileSync(file, "utf8");
            } catch {
              continue;
            }
            const lines = text.split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (ALLOW.some((a) => line.includes(a))) continue;
              for (const [rule, re] of RULES) {
                if (re.test(line)) {
                  hits++;
                  console.log(`::error file=${file},line=${i + 1}::${rule}: ${line.trim().slice(0, 120)}`);
                }
              }
            }
          }

          if (hits > 0) {
            console.log(`\n${hits} suspicious line(s) found.`);
            process.exit(1);
          }
          console.log(`Clean - ${files.length} files scanned, 0 hits.`);
          SCAN

          mapfile -t FILES < <(git ls-files '*.md' '*.txt' '*.arch' '*.svg' '*.yml' '*.yaml' '*.json' '*.html' 'LICENSE')
          node /tmp/scan.mjs "${FILES[@]}"

  no-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse application source
        # Keeps the repository what it says it is. If a real need appears,
        # widen this list deliberately rather than by accident.
        run: |
          BAD=$(git ls-files | grep -Ei '\.(ts|tsx|jsx|env|pem|key|p12|sql)$|(^|/)(src|Dockerfile|docker-compose)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Application source or credential-shaped files are not allowed in this repository:"
            echo "$BAD"
            exit 1
          fi
          echo "Clean - no application source."
